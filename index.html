<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>So I Grew You Some</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-botanical" data-species="grand">
  <!-- Atmospheric glow (only after the bloom; the landing stays pure black) -->
  <div id="ambient-glow"></div>

  <!-- ASCII bouquet layer -->
  <div id="canvas-container">
    <canvas id="ascii-canvas"></canvas>
  </div>

  <!-- Pixel-art intro: seedling, farmer, watering can -->
  <canvas id="intro-canvas" aria-hidden="true"></canvas>

  <!-- Landing: the quote and the water drop -->
  <main id="landing" aria-label="Landing">
    <div class="quote">
      <p class="quote-eyebrow">for you, specifically</p>
      <h1 class="quote-line">
        <span class="ql ql-1">For the days you need flowers</span>
        <span class="ql ql-2">&amp; I'm not there to bring them&hellip;</span>
      </h1>
      <p class="quote-kicker"><span>so I grew you some.</span></p>
    </div>

    <div class="water-cta">
      <button id="btn-water" class="drop-btn" aria-label="Water the seedling">
        <svg class="drop-svg" viewBox="0 0 64 80" aria-hidden="true">
          <defs>
            <linearGradient id="dropFill" x1="0" y1="0" x2="0.4" y2="1">
              <stop offset="0" stop-color="#bfe8ff"/>
              <stop offset="0.55" stop-color="#4fb0ff"/>
              <stop offset="1" stop-color="#1d6fe0"/>
            </linearGradient>
            <radialGradient id="dropShine" cx="0.35" cy="0.55" r="0.35">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <path d="M32 4 C32 4 6 36 6 52 a26 26 0 0 0 52 0 C58 36 32 4 32 4 Z" fill="url(#dropFill)"/>
          <ellipse cx="22" cy="50" rx="7" ry="11" fill="url(#dropShine)" transform="rotate(18 22 50)"/>
          <circle cx="40" cy="64" r="2.4" fill="#ffffff" opacity="0.7"/>
        </svg>
        <span class="drop-ripple"></span>
      </button>
      <p class="water-hint">tap the drop to water her</p>
    </div>
  </main>

  <!-- Speech bubbles (positioned by garden_intro.js) -->
  <div id="plant-bubble" class="pixel-bubble"><span>psst&hellip; water me?</span></div>
  <div id="farmer-bubble" class="pixel-bubble farmer"><span></span></div>

  <!-- Flower bio card -->
  <aside id="botanical-card-container" aria-live="polite">
    <button id="bio-toggle" class="bio-toggle" aria-expanded="true" aria-controls="botanical-card" title="Hide / show the story">
      <span class="when-open" aria-hidden="true">&times;</span>
      <span class="when-closed" aria-hidden="true">&#127800;</span>
    </button>
    <article class="botanical-card" id="botanical-card">
      <div class="bio-badge" id="bio-species-tag"></div>
      <h2 class="bio-title" id="bio-name"></h2>
      <div class="bio-botanical-name" id="bio-botanical-name"></div>
      <p class="bio-text" id="bio-description"></p>
      <div class="bio-fact-box">
        <span class="fact-tag">&#10024; fun fact</span>
        <span id="bio-fact"></span>
      </div>
      <div class="bio-note">
        <span class="note-tag">a note from me &#9825;</span>
        <p id="bio-note"></p>
      </div>
    </article>
  </aside>

  <!-- Controls dock -->
  <nav id="garden-dock" aria-label="Garden controls">
    <div class="dock-group" role="group" aria-label="Flower">
      <button class="chip is-active" data-species-key="grand" data-label="Bouquet">&#128144;</button>
      <button class="chip" data-species-key="roses" data-label="Roses">&#127801;</button>
      <button class="chip" data-species-key="chrysanthemums" data-label="Mums">&#127804;</button>
      <button class="chip" data-species-key="lilies" data-label="Lilies">&#127802;</button>
      <button class="chip" data-species-key="peonies" data-label="Peonies">&#127800;</button>
    </div>
    <div class="dock-sep"></div>
    <div class="dock-group swatches" role="group" aria-label="Colour theme">
      <button class="swatch is-active" style="--sw:conic-gradient(#f5203c 0 33%,#ffb914 0 66%,#32c344 0)" data-theme-key="original" data-label="Classic"></button>
      <button class="swatch" style="--sw:conic-gradient(#ffcd2d 0 50%,#b4781e 0)" data-theme-key="golden" data-label="Gold"></button>
      <button class="swatch" style="--sw:conic-gradient(#ff7da5 0 50%,#fff0f6 0)" data-theme-key="sakura" data-label="Sakura"></button>
      <button class="swatch" style="--sw:conic-gradient(#ff0080 0 50%,#00f5ff 0)" data-theme-key="cyberpunk" data-label="Neon"></button>
      <button class="swatch" style="--sw:conic-gradient(#1ef541 0 50%,#063d10 0)" data-theme-key="matrix" data-label="Matrix"></button>
    </div>
    <div class="dock-sep"></div>
    <button id="btn-sound" class="chip icon" aria-pressed="true" data-label="Sound">
      <span class="snd-on" aria-hidden="true">&#128276;</span><span class="snd-off" aria-hidden="true">&#128277;</span>
    </button>
    <button id="btn-rewater" class="chip icon accent" data-label="Water again">&#128167;</button>
  </nav>

  <script src="lily_bouquet.js"></script>
  <script src="garden_intro.js"></script>
</body>
</html>
